<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Агент</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Чем помочь?</h1>

      <form id="form">
        <input
          id="question"
          type="text"
          autocomplete="off"
          placeholder="Например: найди отчёт по практике"
        />
        <button id="send" type="submit">Спросить</button>
      </form>

      <ol id="trace" aria-live="polite"></ol>
      <p id="answer"></p>

      <section id="plan" hidden>
        <h2 id="plan-intro"></h2>
        <ol id="plan-steps"></ol>
        <p id="plan-trouble"></p>
        <div class="buttons">
          <button id="perform" type="button">Показать, как</button>
          <button id="skip" type="button">Дальше</button>
          <button id="stop" type="button">Остановить</button>
        </div>
      </section>

      <details id="plan-check" open>
        <summary>Прогнать план вручную</summary>
        <textarea
          id="plan-json"
          rows="6"
          spellcheck="false"
          placeholder='{"intro": "...", "steps": [...]}'
        ></textarea>
        <div class="buttons">
          <button id="run-plan" type="button">Прогнать</button>
        </div>
      </details>
    </main>

    <script src="main.js"></script>
  </body>
</html>
