<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Агент</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Чем помочь?</h1>

      <form id="form">
        <input
          id="question"
          type="text"
          autocomplete="off"
          placeholder="Например: найди отчёт по практике"
        />
        <button id="send" type="submit">Спросить</button>
      </form>

      <ol id="trace" aria-live="polite"></ol>
      <p id="answer"></p>
    </main>

    <script src="main.js"></script>
  </body>
</html>
