<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Агент</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Чем помочь?</h1>

      <form id="form">
        <input
          id="question"
          type="text"
          autocomplete="off"
          placeholder="Например: найди отчёт по практике"
        />
        <button id="send" type="submit">Спросить</button>
      </form>

      <ol id="trace" aria-live="polite"></ol>
      <p id="answer"></p>

      <details id="pointer-check" open>
        <summary>Проверка указателя</summary>
        <div class="fields">
          <label>слева <input id="left" type="number" value="100" /></label>
          <label>сверху <input id="top" type="number" value="100" /></label>
          <label>справа <input id="right" type="number" value="300" /></label>
          <label>снизу <input id="bottom" type="number" value="160" /></label>
        </div>
        <div class="buttons">
          <button id="show-pointer" type="button">Показать указатель</button>
          <button id="hide-pointer" type="button">Скрыть указатель</button>
        </div>
      </details>
    </main>

    <script src="main.js"></script>
  </body>
</html>
