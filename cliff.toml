# Changelog собирается из заголовков коммитов, оформленных по CONTRIBUTING.md.
# Merge-коммиты и коммиты не по формату в него не попадают.

[changelog]
header = "# Изменения\n\n"
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Не выпущено
{% endif %}\
{% for group, commits in commits | filter(attribute="merge_commit", value=false) | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim }}\
{% if commit.breaking %} (ломающее изменение){% endif %}\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
    { message = "^chore\\(release\\)", skip = true },
    { message = "^feat", group = "<!-- 0 -->Новое" },
    { message = "^fix", group = "<!-- 1 -->Исправления" },
    { message = "^perf", group = "<!-- 2 -->Быстродействие" },
    { message = "^refactor", group = "<!-- 3 -->Переработка кода" },
    { message = "^docs", group = "<!-- 4 -->Документация" },
    { message = "^test", group = "<!-- 5 -->Тесты" },
    { message = "^(build|ci)", group = "<!-- 6 -->Сборка и CI" },
    { message = "^revert", group = "<!-- 7 -->Откаты" },
    { message = "^(chore|style)", skip = true },
]
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
