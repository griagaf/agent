# Проверяем только платформы, под которые собирается приложение.
[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[licenses]
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
# Свои пакеты не публикуются, лицензия у них не указана.
[licenses.private]
ignore = true

[bans]
# Дубли версий приходят из Tauri и крейтов Windows, повлиять на них нельзя.
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
