[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
version = "0.0.0"
edition = "2024"
authors = ["Григорий Агафонов"]
repository = "https://github.com/griagaf/agent"
publish = false

[workspace.dependencies]
mentor-core = { path = "crates/core" }
mentor-engine = { path = "crates/engine" }
mentor-llm = { path = "crates/llm" }
mentor-platform = { path = "crates/platform" }
mentor-storage = { path = "crates/storage" }
mentor-testkit = { path = "crates/testkit" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-opener = "2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# Размер установщика: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
