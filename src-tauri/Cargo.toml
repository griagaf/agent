[package]
name = "agent-app"
version = "0.1.0"
edition = "2024"

[build-dependencies]
tauri-build = "2.6.3"

[dependencies]
agent = { path = ".." }
anyhow = "1.0.104"
env_logger = "0.11.8"
log = "0.4.29"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.6", features = ["macos-private-api"] }
